<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bdeexam</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="container">
      <h1>Todo App</h1>
      <form class="todo-form">
      <input type="text" placeholder="Add a new todo..." id="todo-input">
      <select id="priority-input" aria-label="Todo priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <button type="submit">Add      </button>
      </form>
      <p id="error-message">Please enter a valid todo.</p>
      <label for="filter-input">Filter tasks:</label>
      <select id="filter-input">
        <option value="all">All tasks</option>
        <option value="completed">Completed</option>
        <option value="not-completed">Not completed</option>
        <option value="low">Low priority</option>
        <option value="medium">Medium priority</option>
        <option value="high">High priority</option>
      </select>

      <ul class="todo-list" id="todo-list">

      </ul>

      <input type="color" id="colorPicker">
      <button type="button" id="counter-button">Count is 0</button>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
